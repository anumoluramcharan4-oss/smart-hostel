version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart_hostel_backend
    restart: unless-stopped
    environment:
      # Supabase PostgreSQL connection string; set in the deployment environment.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the Supabase connection string}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_hostel_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
